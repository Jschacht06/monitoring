# Rename this file to alertmanager.yml and edit it to configure Alertmanager.
route:
  receiver: default
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Teams
receivers:
  - name: default
    msteamsv2_configs:
      - webhook_url: "<paste the workflow URL here>"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} on {{ .CommonLabels.host }}'
        text: |-
          {{ range .Alerts }}- {{ .Annotations.summary }} ({{ .Labels.module }})
          {{ end }}

# Gmail
global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'noc-alerts@example.com'
  smtp_auth_username: 'your-smtp-user'
  smtp_auth_password: 'your-smtp-password'

receivers:
  - name: default
    email_configs:
      - to: 'you@example.com'
        send_resolved: true

# Inhibit rules to prevent duplicate alerts for the same host/service from different modules (e.g., ICMP and HTTP).
inhibit_rules:
  - source_matchers:
      - alertname="ServiceDown"
      - module="icmp"
    target_matchers:
      - alertname="ServiceDown"
      - module="http_2xx"
    equal: [host]