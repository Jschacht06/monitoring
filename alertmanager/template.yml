# Rename this file to alertmanager.yml and edit it to configure Alertmanager.
route:
  receiver: default
  group_by: [alertname, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: email-critical
      continue: true
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
    - matchers:
        - severity="critical"
      receiver: email-escalation
      group_wait: 15m       
      group_interval: 5m
      repeat_interval: 4h
    - matchers:
        - severity="warning"
      receiver: email-warning
      group_wait: 2m
      group_interval: 15m
      repeat_interval: 12h


# Gmail
global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'noc-alerts@example.com'
  smtp_auth_username: 'your-smtp-user'
  smtp_auth_password: 'your-smtp-password'

receivers:
  - name: default
    email_configs:
      - to: 'you@example.com'
        send_resolved: true
  - name: email-critical
    email_configs:
      - to: 'you@example.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }} on {{ .GroupLabels.host }}'
  - name: email-warning
    email_configs:
      - to: 'you@example.com'
        send_resolved: true
        headers:
          Subject: '[WARNING] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }} on {{ .GroupLabels.host }}'
  - name: email-escalation
    email_configs:
      - to: 'you@example.com'
        send_resolved: true
        headers:
          Subject: '[ESCALATED] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }} on {{ .GroupLabels.host }}'


# Inhibit rules to prevent duplicate alerts for the same host/service from different modules (e.g., ICMP and HTTP).
inhibit_rules:
  - source_matchers:
      - alertname="ServiceDown"
      - module="icmp"
    target_matchers:
      - alertname="ServiceDown"
      - module="http_2xx"
    equal: [host]