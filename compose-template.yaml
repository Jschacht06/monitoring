# Docker Compose template for the monitoring stack and sanitized public status page.
# Replace <your-host> (twice: prometheus and alertmanager) with the IP address of your host.
services:
  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
      - --storage.tsdb.retention.size=10GB
      - --web.external-url=http://<your-host>:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://<your-host>:9093
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.10.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9221:9221"
    volumes:
      - ./pve/pve.yml:/etc/prometheus/pve.yml:ro
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    environment:
      LOGGING_URL: https://<logging-host-ip>/loki/api/v1/push
      LOG_HOST: <this-host-name>
      LOG_OWNER: <owner-name>
    volumes:
      - ./alloy/noc-core.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/secrets:/etc/alloy/secrets:ro
      - ./alloy/logging-root.crt:/etc/alloy/logging-root.crt:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only, but still root-equivalent access to Docker
      - alloy_data:/var/lib/alloy/data
      
  # Create status-page/services.json before starting; see docs/public-status-page.md.
  # Loopback by default; use your private LAN IP in the local copy for direct LAN access.
  status-page:
    build: ./status-page
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      STATUS_CONFIG: /config/services.json
    volumes:
      - type: bind
        source: ./status-page/services.json
        target: /config/services.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  alloy_data: