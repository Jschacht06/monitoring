rule_files: []
evaluation_interval: 30s
tests:
  - name: healthy-probe
    interval: 30s
    input_series:
      - series: "probe_success{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1+0x6"
      - series: "up{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1+0x6"
    promql_expr_test:
      - expr: "(probe_success{job=\"blackbox\"} == 1) and (up{job=\"blackbox\"} == 1) and (time() - timestamp(probe_success{job=\"blackbox\"}) < 90) and (time() - timestamp(up{job=\"blackbox\"}) < 90)"
        eval_time: 1m
        exp_samples:
          - labels: "probe_success{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
            value: 1
  - name: destination-down
    interval: 30s
    input_series:
      - series: "probe_success{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "0+0x6"
      - series: "up{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1+0x6"
    promql_expr_test:
      - expr: "(probe_success{job=\"blackbox\"} == 1) and (up{job=\"blackbox\"} == 1) and (time() - timestamp(probe_success{job=\"blackbox\"}) < 90) and (time() - timestamp(up{job=\"blackbox\"}) < 90)"
        eval_time: 2m
        exp_samples: []
  - name: scrape-failed
    interval: 30s
    input_series:
      - series: "probe_success{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1+0x6"
      - series: "up{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "0+0x6"
    promql_expr_test:
      - expr: "(probe_success{job=\"blackbox\"} == 1) and (up{job=\"blackbox\"} == 1) and (time() - timestamp(probe_success{job=\"blackbox\"}) < 90) and (time() - timestamp(up{job=\"blackbox\"}) < 90)"
        eval_time: 2m
        exp_samples: []
  - name: probe-stale
    interval: 30s
    input_series:
      - series: "probe_success{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1 _ _ _ _ _"
      - series: "up{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1+0x6"
    promql_expr_test:
      - expr: "(probe_success{job=\"blackbox\"} == 1) and (up{job=\"blackbox\"} == 1) and (time() - timestamp(probe_success{job=\"blackbox\"}) < 90) and (time() - timestamp(up{job=\"blackbox\"}) < 90)"
        eval_time: 2m
        exp_samples: []
  - name: scrape-stale
    interval: 30s
    input_series:
      - series: "probe_success{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1+0x6"
      - series: "up{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1 _ _ _ _ _"
    promql_expr_test:
      - expr: "(probe_success{job=\"blackbox\"} == 1) and (up{job=\"blackbox\"} == 1) and (time() - timestamp(probe_success{job=\"blackbox\"}) < 90) and (time() - timestamp(up{job=\"blackbox\"}) < 90)"
        eval_time: 2m
        exp_samples: []
  - name: missing-probe
    interval: 30s
    input_series:
      - series: "up{job=\"blackbox\",service=\"example\",host=\"private-host\",module=\"http_2xx\",instance=\"http://example.invalid\"}"
        values: "1+0x6"
    promql_expr_test:
      - expr: "(probe_success{job=\"blackbox\"} == 1) and (up{job=\"blackbox\"} == 1) and (time() - timestamp(probe_success{job=\"blackbox\"}) < 90) and (time() - timestamp(up{job=\"blackbox\"}) < 90)"
        eval_time: 1m
        exp_samples: []
